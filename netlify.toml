[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires Node ^20.19 || >=22.12; pin so a host default can't break the build.
  NODE_VERSION = "22"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must revalidate on every load, or an old worker can pin an
# old shell for up to 24 h after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
